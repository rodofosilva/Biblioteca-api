<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3"><div class="container">
  <span class="navbar-brand">📚 Biblioteca</span>
  <a class="btn btn-outline-light btn-sm" href="/swagger-ui.html" target="_blank">Swagger</a>
</div></nav>
<div class="container">
  <div id="msg"></div>
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tLivros">Livros</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tEmp">Empréstimos</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tLivros">
      <div class="row g-2 mb-2">
        <div class="col-md"><input id="fCat" class="form-control" placeholder="Categoria"></div>
        <div class="col-md"><input id="fAutor" class="form-control" placeholder="Autor"></div>
        <div class="col-md"><select id="fDisp" class="form-select"><option value="">Todos</option><option value="true">Disponíveis</option><option value="false">Indisponíveis</option></select></div>
        <div class="col-md-auto"><button class="btn btn-secondary" onclick="listarLivros()">Filtrar</button></div>
      </div>
      <table class="table table-sm table-striped bg-white"><thead><tr><th>ID</th><th>Título</th><th>Autor</th><th>Categoria</th><th>Disp./Total</th><th></th></tr></thead><tbody id="tbLivros"></tbody></table>
      <div class="card card-body mb-4"><h6 id="tituloForm">Novo livro</h6>
        <div class="row g-2"><input type="hidden" id="lId">
          <div class="col-md"><input id="lTitulo" class="form-control" placeholder="Título"></div>
          <div class="col-md"><input id="lAutor" class="form-control" placeholder="Autor"></div>
          <div class="col-md"><input id="lCat" class="form-control" placeholder="Categoria"></div>
          <div class="col-md-2"><input id="lQtd" type="number" min="1" class="form-control" placeholder="Qtd"></div>
          <div class="col-md-auto"><button class="btn btn-primary" onclick="salvarLivro()">Salvar</button> <button class="btn btn-outline-secondary" onclick="limparLivro()">Limpar</button></div>
        </div></div>
    </div>
    <div class="tab-pane fade" id="tEmp">
      <div class="row g-2 mb-2">
        <div class="col-md"><select id="fStatus" class="form-select"><option value="">Todos os status</option><option>ATIVO</option><option>ATRASADO</option><option>DEVOLVIDO</option></select></div>
        <div class="col-md"><input id="fUsuario" class="form-control" placeholder="Usuário"></div>
        <div class="col-md-auto"><button class="btn btn-secondary" onclick="listarEmp()">Filtrar</button></div>
      </div>
      <table class="table table-sm table-striped bg-white"><thead><tr><th>ID</th><th>Livro</th><th>Usuário</th><th>Empréstimo</th><th>Previsão</th><th>Status</th><th>Multa</th><th></th></tr></thead><tbody id="tbEmp"></tbody></table>
      <div class="card card-body"><h6>Novo empréstimo</h6>
        <div class="row g-2">
          <div class="col-md"><select id="eLivro" class="form-select"></select></div>
          <div class="col-md"><input id="eNome" class="form-control" placeholder="Nome do usuário"></div>
          <div class="col-md-2"><input id="eDias" type="number" min="1" max="30" value="7" class="form-control" title="Dias"></div>
          <div class="col-md-auto"><button class="btn btn-primary" onclick="criarEmp()">Emprestar</button></div>
        </div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function aviso(texto, tipo='danger') {
  $('msg').innerHTML = `<div class="alert alert-${tipo} alert-dismissible">${esc(texto)}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
}
async function api(path, opts = {}) {
  const resp = await fetch(path, { headers: {'Content-Type': 'application/json'}, ...opts });
  if (!resp.ok) { const e = await resp.json().catch(() => ({})); aviso(`${resp.status} - ${e.mensagem || 'Erro inesperado'}`); return null; }
  return resp.status === 204 ? true : resp.json();
}
const qs = o => { const p = new URLSearchParams(); Object.entries(o).forEach(([k,v]) => v && p.append(k,v)); const s = p.toString(); return s ? '?' + s : ''; };

async function listarLivros() {
  const livros = await api('/livros' + qs({categoria: $('fCat').value, autor: $('fAutor').value, disponivel: $('fDisp').value}));
  if (!livros) return;
  $('tbLivros').innerHTML = livros.map(l => `<tr><td>${l.id}</td><td>${esc(l.titulo)}</td><td>${esc(l.autor)}</td><td>${esc(l.categoria)}</td>
    <td>${l.quantidadeDisponivel}/${l.quantidadeTotal}</td>
    <td class="text-end"><button class="btn btn-sm btn-outline-primary" onclick="editarLivro(${l.id})">Editar</button>
    <button class="btn btn-sm btn-outline-danger" onclick="excluirLivro(${l.id})">Excluir</button></td></tr>`).join('');
  carregarSelect();
}
async function carregarSelect() {
  const livros = await api('/livros'); if (!livros) return;
  const atual = $('eLivro').value;
  $('eLivro').innerHTML = livros.map(l => `<option value="${l.id}">${esc(l.titulo)} (${l.quantidadeDisponivel} disp.)</option>`).join('');
  if (atual) $('eLivro').value = atual;
}
async function editarLivro(id) {
  const l = await api('/livros/' + id); if (!l) return;
  $('lId').value = l.id; $('lTitulo').value = l.titulo; $('lAutor').value = l.autor; $('lCat').value = l.categoria; $('lQtd').value = l.quantidadeTotal;
  $('tituloForm').textContent = 'Editando livro #' + l.id;
}
function limparLivro() { ['lId','lTitulo','lAutor','lCat','lQtd'].forEach(i => $(i).value = ''); $('tituloForm').textContent = 'Novo livro'; }
async function salvarLivro() {
  const id = $('lId').value;
  const body = JSON.stringify({titulo: $('lTitulo').value, autor: $('lAutor').value, categoria: $('lCat').value, quantidadeTotal: $('lQtd').value ? Number($('lQtd').value) : null});
  const r = await api(id ? '/livros/' + id : '/livros', {method: id ? 'PUT' : 'POST', body});
  if (r) { aviso('Livro salvo com sucesso', 'success'); limparLivro(); listarLivros(); }
}
async function excluirLivro(id) {
  if (!confirm('Excluir livro?')) return;
  if (await api('/livros/' + id, {method: 'DELETE'})) { aviso('Livro excluído', 'success'); listarLivros(); }
}

async function listarEmp() {
  const emps = await api('/emprestimos' + qs({status: $('fStatus').value, usuario: $('fUsuario').value}));
  if (!emps) return;
  const cor = {ATIVO:'primary', ATRASADO:'danger', DEVOLVIDO:'success'};
  $('tbEmp').innerHTML = emps.map(e => `<tr><td>${e.id}</td><td>${esc(e.livro.titulo)}</td><td>${esc(e.nomeUsuario)}</td>
    <td>${e.dataEmprestimo}</td><td>${e.dataPrevistaDevolucao}</td><td><span class="badge bg-${cor[e.status]}">${e.status}</span></td>
    <td>R$ ${Number(e.multa || 0).toFixed(2)}</td>
    <td class="text-end">${e.status !== 'DEVOLVIDO' ? `<button class="btn btn-sm btn-outline-success" onclick="devolver(${e.id})">Devolver</button>` : ''}
    <button class="btn btn-sm btn-outline-danger" onclick="excluirEmp(${e.id})">Excluir</button></td></tr>`).join('');
}
async function criarEmp() {
  const body = JSON.stringify({livroId: Number($('eLivro').value) || null, nomeUsuario: $('eNome').value, dias: Number($('eDias').value) || null});
  if (await api('/emprestimos', {method: 'POST', body})) { aviso('Empréstimo realizado', 'success'); $('eNome').value = ''; listarEmp(); listarLivros(); }
}
async function devolver(id) {
  if (await api(`/emprestimos/${id}/devolucao`, {method: 'PATCH'})) { aviso('Devolução registrada', 'success'); listarEmp(); listarLivros(); }
}
async function excluirEmp(id) {
  if (await api('/emprestimos/' + id, {method: 'DELETE'})) { aviso('Empréstimo excluído', 'success'); listarEmp(); }
}
listarLivros(); listarEmp();
</script>
</body>
</html>
